modLoader="javafml"
loaderVersion="[4,)"
license="MIT"

# ============================================================================
# CobbleDollars-Bundle buendelt Basis + CobbleDollars + CobbleDollars/Create +
# CobbleDollars/CustomNPCs in EINEM Jar (NeoForge erlaubt mehrere
# [[mods]]-Eintraege pro Jar, jeder mit eigenem @Mod-Konstruktor - der
# Java-Code ist dafuer 1:1 unveraendert aus den getrennten Repos
# uebernommen, siehe CobbleCompanion-AllInOne fuer dasselbe Muster).
# BEWUSST NICHT enthalten: CobblemonWorker (Pokémon-Bauplan-System) und
# CobbleCompanion: Create/Let's Do (Farm & Charm-Bruecke) - beide bleiben
# eigenstaendige, separate Mods.
#
# WICHTIG: alle Fremd-Mod-Abhaengigkeiten (create, cobbledollars, customnpcs,
# create_mobile_packages) sind hier bewusst "optional", auch dort, wo die
# jeweilige STANDALONE-Version dieses Teilmoduls sie "required" deklariert.
# Grund: ein einzelner fehlender "required"-Fremd-Mod blockiert bei NeoForge
# den kompletten Spielstart - das würde die Idee eines Bundles (eine Datei
# installieren, jedes Feature aktiviert sich automatisch NUR wenn sein
# Fremd-Mod da ist) zunichtemachen. Die Feature-Gates selbst laufen ohnehin
# schon zur Laufzeit über com.cobblecompanion.integrations.ModAvailability,
# nicht über diese Abhaengigkeits-Deklaration - siehe die jeweiligen
# onServerStarting-Methoden. Nur die Abhaengigkeiten INNERHALB dieses Jars
# (cobblecompanion, cobblecompanion_cobbledollars) bleiben "required" - die
# sind hier garantiert immer vorhanden.
# ============================================================================

# ===== cobblecompanion (Basis) =====

[[dependencies.cobblecompanion]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.233,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.cobblecompanion]]
