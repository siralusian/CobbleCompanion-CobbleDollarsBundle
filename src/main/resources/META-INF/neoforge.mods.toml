# ============================================================================
# Mixins - identische requiredMods-Bedingungen wie in den getrennten Repos,
# diese gaten das Laden JEDES einzelnen Mixin-Configs unabhaengig von den
# obigen (fuer Bundle absichtlich gelockerten) Mod-Abhaengigkeiten.
# ============================================================================

[[mixins]]
    config="cobblecompanion_cobblemon_client.mixins.json"

[[mixins]]
    config="cobblecompanion_vanilla_client.mixins.json"

[[mixins]]
    config="cobblecompanion_cobbledollars.mixins.json"
    requiredMods=["cobbledollars"]

[[mixins]]
    config="cobblecompanion_cobbledollars_create.mixins.json"
    requiredMods=["cobbledollars", "create"]

[[mixins]]
    config="cobblecompanion_cobbledollars_create_client.mixins.json"
    requiredMods=["cobbledollars", "create"]

[[mixins]]
    config="cobblecompanion_cobbledollars_create_buyshop.mixins.json"
    requiredMods=["cobbledollars", "create"]

[[mixins]]
    config="cobblecompanion_cobbledollars_create_mobilepackages.mixins.json"
    requiredMods=["cobbledollars", "create", "create_mobile_packages"]

[[mixins]]
    config="cobblecompanion_cobbledollars_customnpcs.mixins.json"
    requiredMods=["customnpcs", "cobbledollars"]

[[mixins]]
    config="cobblecompanion_cobbledollars_customnpcs_create.mixins.json"
    requiredMods=["customnpcs", "create"]

# ============================================================================
# Mods - je ein @Mod-Konstruktor pro Eintrag, unveraendert aus den
# getrennten Repos uebernommen (siehe Klassenkommentar oben).
# ============================================================================

[[mods]]
    modId="cobblecompanion"
    version="0.1.0"
    displayName="CobbleCompanion"
    displayTest="IGNORE_ALL_VERSION"
    description="Your Cobblemon companion – Pokedex, Living Dex, Box Helper and more."

[[mods]]
    modId="cobblecompanion_cobbledollars"
    version="0.1.0"
    displayName="CobbleCompanion: CobbleDollars"
    displayTest="IGNORE_ALL_VERSION"
    description="CobbleDollars-Erweiterung fuer CobbleCompanion: Wallet-Tab, Ueberweisungen und Creative-Zeitkauf."

[[mods]]
    modId="cobblecompanion_cobbledollars_create"
    version="0.1.0"
    displayName="CobbleCompanion: CobbleDollars/Create"
    displayTest="IGNORE_ALL_VERSION"
    description="Verbindet Create (Lagerticker, Schlauer Beobachter) mit CobbleDollars fuer CobbleCompanion."

[[mods]]
    modId="cobblecompanion_cobbledollars_customnpcs"
    version="0.1.0"
    displayName="CobbleCompanion: CobbleDollars/CustomNPCs"
    displayTest="IGNORE_ALL_VERSION"
    description="Verbindet CustomNPCs-Unofficial-NeoForge mit CobbleDollars fuer CobbleCompanion."
