plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
}

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    // CobbleDollars-Bundle deklariert VIER echte Mods (siehe neoforge.mods.toml) in EINEM
    // gemeinsamen sourceSet - jeder Eintrag hier verweist auf denselben sourceSet, damit
    // NeoGradles Dev-Run (runClient/runServer) alle vier @Mod-Konstruktoren korrekt findet.
    mods {
        "cobblecompanion" {
            sourceSet(sourceSets.main)
        }
        "cobblecompanion_cobbledollars" {
            sourceSet(sourceSets.main)
        }
        "cobblecompanion_cobbledollars_create" {
            sourceSet(sourceSets.main)
        }
        "cobblecompanion_cobbledollars_customnpcs" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Cobblemon als lokale JAR (required)
    implementation fileTree(dir: 'libs', include: ['Cobblemon*.jar'])

    // Optionale Fremd-Mod-Integrationen: zur Laufzeit NICHT vorausgesetzt (Gradles jar-Task
    // bettet fileTree-Jars ohnehin nie ins gebaute Jar ein). implementation statt compileOnly,
    // damit die Mods auch im Dev-Run (runServer/runClient) tatsaechlich geladen werden. Die
    // eigentliche "optional"-Eigenschaft kommt ausschliesslich aus
    // com.cobblecompanion.integrations.ModAvailability + der neoforge.mods.toml, nicht aus der
    // Gradle-Dependency-Konfiguration. BEWUSST OHNE letsdo-farm_and_charm*.jar - die Create/
    // Let's-Do-Bruecke ist kein Teil dieses Bundles.
    implementation fileTree(dir: 'libs', include: [
        'CobbleDollars*.jar', 'create-*.jar', 'create_mobile_packages*.jar',
        'rctapi*.jar', 'rctmod*.jar', 'architectury*.jar', 'curios-*.jar',
        'ponder*.jar', 'create_factory_abstractions*.jar', 'CustomNPCs*.jar'
    ])

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.21'
}

processResources {
    var replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        neo_version_range      : neo_version_range,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
